server {
    server_name api.travelkhiva.uz;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server_tokens off;
    client_max_body_size 100M;

    location / {
        limit_except GET POST HEAD PUT DELETE { deny all; }
        proxy_pass http://localhost:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/travelkhiva.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/travelkhiva.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = travelkhiva.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name travelkhiva.uz;
    return 404; # managed by Certbot


}

server {
    if ($host = api.travelkhiva.uz) {
        return 301 https://$host$request_uri;
